version: "3.9"
services:
  app:
    build: .
    container_name: safari-bookmark-organizer
    ports:
      - "8000:8000"
    environment:
      OPENCODE_MODEL: "${OPENCODE_MODEL:-openai/gpt-4o-mini}"
      OPENCODE_ENABLED: "${OPENCODE_ENABLED:-1}"
      OPENCODE_BATCH_SIZE: "${OPENCODE_BATCH_SIZE:-50}"
    volumes:
      - "${BOOKMARKS_PATH:-./local_bookmarks.plist}:/data/bookmarks.plist:ro"
    command: ["uv", "run", "safari-organizer", "preview", "/data/bookmarks.plist", "--host", "0.0.0.0", "--port", "8000", "--no-open"]

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-tunnel
    depends_on:
      - app
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN}"]
