[project]
name = "safari-bookmark-organizer"
version = "0.1.0"
description = "AI-powered Safari bookmark organizer using LLM APIs for smart categorization"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Chi Ejimofor", email = "chi@peacockery.studio" }
]
keywords = ["safari", "bookmarks", "organization", "ai", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "loguru>=0.7.0",
    "openai>=1.50",
    "pydantic>=2.1",
    "pydantic-settings>=2.13.0",
    "typer>=0.15",
]

[project.urls]
Homepage = "https://github.com/peacockery/safari-bookmark-organizer"
Documentation = "https://github.com/peacockery/safari-bookmark-organizer#readme"
Repository = "https://github.com/peacockery/safari-bookmark-organizer"

[project.scripts]
safari-organizer = "safari_bookmark_organizer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/safari_bookmark_organizer"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff",
    "ty>=0.0.17",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
extend-select = [
    "F",    # Pyflakes rules
    "W",    # PyCodeStyle warnings
    "E",    # PyCodeStyle errors
    "I",    # Sort imports properly
    "B",    # flake8-bugbear
    "UP",   # Warn if certain things can be changed due to newer Python versions
    "C4",   # Catch incorrect use of comprehensions, dict, list, etc
    "FA",   # Enforce from __future__ import annotations
    "ISC",  # Good use of string concatenation
    "ICN",  # Use common import conventions
    "RET",  # Good return practices
    "SIM",  # Common simplification rules
    "TID",  # Some good import practices
    "TC",   # Enforce importing certain types in a TYPE_CHECKING block
    "PTH",  # Use pathlib instead of os.path
    "TD",   # Be diligent with TODO comments
    "S",    # flake8-bandit security checks
    "PERF", # Performance anti-patterns
    "PL",   # Pylint rules
    "RUF",  # Ruff-specific rules
    "ERA",  # Detect commented-out code
    "FBT",  # Boolean trap detection
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "B008",    # function calls in argument defaults (needed for typer.Option())
    "PLR2004", # magic value comparisons
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "FBT", "PLR0913", "PLC0415", "TC"]
"src/**/cli.py" = ["FBT", "PLR0913"]
"src/**/preview.py" = ["FBT001", "PLR0913"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.src]
exclude = ["demo.py"]

[tool.ty.rules]
# Pydantic BaseSettings accepts _env_file at runtime via model_post_init,
# but ty doesn't understand this generated __init__ parameter yet.
unknown-argument = "ignore"

[tool.ty.environment]
python-version = "3.12"
